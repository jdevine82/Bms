[project]
name = "devine-bms"
version = "0.1.0"
description = "Devine BMS site backend"
readme = "README.md"
authors = [
    { name = "Jason Devine" }
]
requires-python = ">=3.12"
dependencies = [
    "aiomqtt>=2.5.1",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "bacpypes3>=0.0.110",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic>=2",
    "pydantic-settings>=2.16.2",
    "pymodbus>=3.16.1",
    "pyserial>=3.5",
    "sqlalchemy[asyncio]>=2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "phable>=0.1.29",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root, so tests can import simulators.modbus_meter.
pythonpath = [".."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["db: needs a PostgreSQL database (set BMS_TEST_DATABASE_URL)"]
